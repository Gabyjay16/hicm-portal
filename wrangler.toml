name = "hicm-portal"
compatibility_date = "2024-03-20"
pages_build_output_dir = "dist"

# Bindings for the Database
[[d1_databases]]
binding = "DB" # Available in your code as `env.DB`
database_name = "hicm_db"
database_id = "00000000-0000-0000-0000-000000000000" # Replace with real ID when provisioned

# Bindings for Storage (Lecture Notes, Profile Pics, Plagiarism Docs)
[[r2_buckets]]
binding = "STORAGE" # Available in your code as `env.STORAGE`
bucket_name = "hicm-storage"
